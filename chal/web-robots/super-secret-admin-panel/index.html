<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08070a">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
  :root { --void:#08070a; --panel:#100e14; --panel-2:#17141c; --wire:#272231; --wire-strong:#3a3348; --ink:#f2f0f4; --ink-2:#9d98a6; --ink-3:#847e92; --sig:#e6293f; --sig-hot:#ff4257; --sig-soft:rgba(230,41,63,.1); --amber:#f0a830; --phos:#3ddc84; --phos-soft:rgba(61,220,132,.1); --phos-line:rgba(61,220,132,.28); --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--void); color:var(--ink); font:16px/1.65 var(--sans); -webkit-font-smoothing:antialiased; }
  .bar { border-bottom:1px solid var(--wire); background:rgba(8,7,10,.88); }
  .bar-inner { max-width:760px; margin:0 auto; padding:0 24px; height:60px; display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:13px; }
  .bar a { color:var(--ink-2); text-decoration:none; transition:color .2s; }
  .bar a:hover { color:var(--sig-hot); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; color:var(--ink) !important; }
  .brand svg { width:28px; height:28px; }
  main { max-width:760px; margin:0 auto; padding:48px 24px 96px; }
  .eyebrow { display:flex; align-items:center; gap:8px; margin:0 0 14px; font:500 12px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); }
  .eyebrow::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--phos); box-shadow:0 0 0 3px var(--phos-soft); }
  h1, h2, h3 { font-family:var(--mono); font-weight:600; letter-spacing:-.02em; line-height:1.15; margin:0 0 14px; }
  h1 { font-size:clamp(1.7rem,4vw,2.2rem); letter-spacing:-.03em; }
  h3 { font-size:1.05rem; margin-top:28px; }
  p { color:var(--ink-2); margin:0 0 16px; max-width:60ch; }
  b { color:var(--ink); font-weight:600; }
  a { color:var(--ink); text-underline-offset:3px; }
  em { color:var(--ink); }
  .muted { color:var(--ink-3); }
  code, pre { font-family:var(--mono); font-size:.88em; background:var(--panel-2); border:1px solid var(--wire); padding:1px 6px; border-radius:4px; color:var(--ink); }
  pre { padding:16px 18px; white-space:pre-wrap; line-height:1.6; font-size:.92rem; background:var(--panel); }
  .card { background:var(--panel); border:1px solid var(--wire); border-radius:4px; padding:24px; margin-top:24px; }
  input, button { font:600 13px var(--mono); letter-spacing:.02em; color:var(--ink); background:var(--void); border:1px solid var(--wire-strong); border-radius:4px; padding:12px 16px; }
  input { font-weight:400; min-width:0; transition:border-color .2s, box-shadow .2s; }
  input:focus { outline:none; border-color:var(--sig); box-shadow:0 0 0 3px var(--sig-soft); }
  input::placeholder { color:var(--ink-3); }
  button { cursor:pointer; background:var(--sig); border-color:var(--sig); color:#fff; transition:background .2s, transform .15s; }
  button:hover { background:var(--sig-hot); border-color:var(--sig-hot); }
  button:active { transform:translateY(1px); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  form input { flex:1; }
  .flag { display:block; margin-top:8px; font-family:var(--mono); font-size:1rem; color:var(--phos); background:var(--phos-soft); border:1px solid var(--phos-line); padding:14px 16px; border-radius:4px; word-break:break-all; }
  .msg-bad { color:var(--sig-hot); font-family:var(--mono); font-size:13px; }
  :focus-visible { outline:2px solid var(--sig); outline-offset:3px; }
  [hidden] { display:none !important; }
</style>

</head>
<body>
<header class="bar"><div class="bar-inner"><a class="brand" href="../../../"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7L4 23V9z" fill="#08070a" stroke="#e6293f" stroke-width="2"/><path d="M11 22V10l10 12V10" fill="none" stroke="#f2f0f4" stroke-width="2.2" stroke-linejoin="round"/></svg><span>NxT CTF</span></a><a href="../../../#challenges">&larr; back to challenges</a></div></header>
<main><p class="eyebrow">live target</p><h1>Admin panel</h1><p>Hidden from search engines... but not from you.</p><p class="flag">NxT{robots_cant_keep_secrets}</p></main>
</body>
</html>
